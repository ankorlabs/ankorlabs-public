<script>
(() => {
const COLS = 20, ROWS = 26, BASE_SPEED = 20, TARGET = 0.85;
// video frame (9:16) and where things sit inside it; kept clear of the Reels top bar and caption area
const W = 1080, H = 1920, CELL = 48, BX = 60, BY = 300, BW = COLS * CELL, BH = ROWS * CELL;
const CV = { bg: "#121317", fg: "#ecebe7", dim: "#7d7f87", ink: "#2a2b30" };
const PALETTE = [
  { name: "Butter",     tile: "#f7dc8f", ball: "#c99a1e" },
  { name: "Sky",        tile: "#a9cdee", ball: "#3f7fbf" },
  { name: "Rose",       tile: "#f4a3a0", ball: "#cc4f4a" },
  { name: "Peony",      tile: "#efb8dc", ball: "#b9549a" },
  { name: "Mint",       tile: "#a8e6c9", ball: "#2f9e6e" },
  { name: "Lilac",      tile: "#cdb8f2", ball: "#7a55c7" },
  { name: "Peach",      tile: "#fbc59a", ball: "#d9772b" },
  { name: "Sage",       tile: "#c3d3a4", ball: "#6f8a3c" },
  { name: "Aqua",       tile: "#9fe0e4", ball: "#2a98a3" },
  { name: "Coral",      tile: "#ff9f85", ball: "#d9532f" },
  { name: "Lime",       tile: "#d3ee9a", ball: "#7fa51f" },
  { name: "Periwinkle", tile: "#b3bdf5", ball: "#4f5fcf" },
  { name: "Sand",       tile: "#e6d3b3", ball: "#a37f45" },
  { name: "Orchid",     tile: "#e3a6ee", ball: "#a140b5" },
  { name: "Mist",       tile: "#c3ccd6", ball: "#5f7388" },
  { name: "Cocoa",      tile: "#d9b8a6", ball: "#96604a" },
];
let TEAMS = [];                    // the colours playing this game, one per team
const choice = [-1, -1, -1, -1];   // colour picked for each team in the Colours row; -1 = random
const POWERS = {
  nitro:  { label: "Nitro",   dur: 7,   desc: "2.2× speed for 7s" },
  wreck:  { label: "Wrecker", dur: 5,   desc: "plows through tiles for 5s" },
  giant:  { label: "Giant",   dur: 8,   desc: "2.5× size for 8s" },
  split:  { label: "Split",   dur: 10,  desc: "two extra balls for 10s" },
  fort:   { label: "Fortify", dur: 0,   desc: "border tiles take 3 hits" },
  bomb:   { label: "Bomb",    dur: 0,   desc: "claims a wide blast circle" },
  freeze: { label: "Freeze",  dur: 4,   desc: "rival balls stop for 4s" },
  laser:  { label: "Laser",   dur: 0,   desc: "claims its row and column" },
  shield: { label: "Shield",  dur: 5,   desc: "own turf untouchable for 5s" },
  magnet: { label: "Magnet",  dur: 8,   desc: "pulls power-ups in for 8s" },
  quake:  { label: "Quake",   dur: 0,   desc: "border pushes out 2 tiles" },
  mirror: { label: "Mirror",  dur: 0,   desc: "copies the last rival power-up" },
  steal:  { label: "Steal",   dur: 0,   desc: "takes rivals' boosts and extra balls" },
};
const KEYS = Object.keys(POWERS);

const $ = id => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d");
let nTeams = 2, speedMult = 1, powersOn = true;
let owner, hp, flash, balls, pickups, time, nextPickup, over, counts, alive, shield, frozen, lastPower, recent, outs;
let event = null, winInfo = null;

let rng = Math.random;
function seedRandom(seed) { // mulberry32 from a string hash; same seed -> same game
  let h = 1779033703 ^ String(seed).length;
  for (const ch of String(seed)) { h = Math.imul(h ^ ch.charCodeAt(0), 3432918353); h = (h << 13) | (h >>> 19); }
  let a = h >>> 0;
  rng = () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const rand = (a, b) => a + rng() * (b - a);
const idx = (i, j) => j * COLS + i;
const inB = (i, j) => i >= 0 && j >= 0 && i < COLS && j < ROWS;
const rgb = hex => { const n = parseInt(hex.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; };
const rgba = (hex, a) => `rgba(${rgb(hex).join(",")},${a})`;
const mix = (hex, w, t) => `rgb(${rgb(hex).map(c => Math.round(c + (w - c) * t)).join(",")})`;
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;

function fixAngle(b) {
  let a = Math.atan2(b.dy, b.dx) + rand(-0.06, 0.06);
  b.dx = Math.cos(a); b.dy = Math.sin(a);
  if (Math.abs(b.dx) < 0.35) b.dx = 0.35 * Math.sign(b.dx || 1);
  if (Math.abs(b.dy) < 0.35) b.dy = 0.35 * Math.sign(b.dy || 1);
  const m = Math.hypot(b.dx, b.dy); b.dx /= m; b.dy /= m;
}
function newBall(team, x, y, temp = 0) {
  const a = rand(0, Math.PI * 2);
  const b = { team, x, y, dx: Math.cos(a), dy: Math.sin(a), r: 0.4, nitro: 0, wreck: 0, giant: 0, magnet: 0, temp, trail: [] };
  fixAngle(b); return b;
}

// Every game draws its colours at random from the palette (unless one was picked for a team),
// re-drawing a few times so two look-alike pastels don't end up in the same game.
function pickColours() {
  let best = null, bestGap = -1;
  for (let tries = 0; tries < 200 && bestGap < 70; tries++) {
    const used = new Set(choice.slice(0, nTeams).filter(c => c >= 0)), set = [];
    for (let t = 0; t < nTeams; t++) {
      let c = choice[t];
      if (c < 0) { do c = Math.floor(rng() * PALETTE.length); while (used.has(c)); used.add(c); }
      set.push(c);
    }
    let gap = Infinity;
    for (let a = 0; a < nTeams; a++) for (let b = a + 1; b < nTeams; b++) {
      if (choice[a] >= 0 && choice[b] >= 0) continue;
      const A = rgb(PALETTE[set[a]].tile), B = rgb(PALETTE[set[b]].tile);
      gap = Math.min(gap, Math.hypot(A[0] - B[0], A[1] - B[1], A[2] - B[2]));
    }
    if (gap > bestGap) { bestGap = gap; best = set; }
  }
  TEAMS = best.map(c => PALETTE[c]);
  document.querySelectorAll("#gCols label").forEach((l, t) => {
    l.hidden = t >= nTeams;
    if (t < nTeams) l.firstChild.style.background = TEAMS[t].ball;
  });
}

function reset() {
  pickColours();
  owner = new Int8Array(COLS * ROWS); hp = new Uint8Array(COLS * ROWS); flash = new Float32Array(COLS * ROWS);
  shield = new Array(nTeams).fill(0); frozen = new Array(nTeams).fill(0); lastPower = null;
  recent = Array.from({ length: nTeams }, () => []); outs = new Array(nTeams).fill(false);
  const cx = COLS / 2, cy = ROWS / 2, sums = Array.from({ length: nTeams }, () => ({ x: 0, y: 0, n: 0 }));
  for (let j = 0; j < ROWS; j++) for (let i = 0; i < COLS; i++) {
    let t;
    if (nTeams === 2) t = j < ROWS / 2 ? 0 : 1;
    else if (nTeams === 4) t = (j < cy ? 0 : 2) + (i < cx ? 0 : 1);
    else {
      const ang = Math.atan2(j + .5 - cy, i + .5 - cx) + Math.PI / 2;
      t = Math.floor(((ang + Math.PI * 2) % (Math.PI * 2)) / (Math.PI * 2 / 3)) % 3;
    }
    owner[idx(i, j)] = t; sums[t].x += i + .5; sums[t].y += j + .5; sums[t].n++;
  }
  balls = sums.map((s, t) => newBall(t, s.x / s.n, s.y / s.n));
  pickups = []; time = 0; nextPickup = 2; over = false; event = null; winInfo = null;
  tally();
}

function announce(team, text) { event = { team, text, left: 2.5 }; }

function claim(c, team, force) {
  if (owner[c] === team) return;
  if (!force && shield[owner[c]] > 0) { flash[c] = 0.3; return; }
  if (!force && hp[c] > 0) { hp[c]--; flash[c] = 0.5; return; }
  owner[c] = team; hp[c] = 0; flash[c] = 1;
}

const N4 = [[1,0],[-1,0],[0,1],[0,-1]];
function borderOf(t, enemy) { // cells next to team t's turf; enemy=true -> rival cells, false -> own cells
  const out = [];
  for (let c = 0; c < owner.length; c++) {
    if ((owner[c] === t) === enemy) continue;
    const i = c % COLS, j = (c / COLS) | 0;
    if (N4.some(([a, d]) => inB(i + a, j + d) && (owner[idx(i + a, j + d)] === t) === enemy)) out.push(c);
  }
  return out;
}

function applyPower(b, type, mirrored) {
  const P = POWERS[type], t = b.team;
  switch (type) {
    case "split": balls.push(newBall(t, b.x, b.y, P.dur), newBall(t, b.x, b.y, P.dur)); break;
    case "fort": for (const c of borderOf(t, false)) { hp[c] = 3; flash[c] = 0.4; } break;
    case "bomb":
      for (let j = 0; j < ROWS; j++) for (let i = 0; i < COLS; i++)
        if (Math.hypot(i + .5 - b.x, j + .5 - b.y) <= 4.3) claim(idx(i, j), t, true);
      break;
    case "laser": {
      const ci = Math.min(COLS - 1, Math.floor(b.x)), cj = Math.min(ROWS - 1, Math.floor(b.y));
      for (let i = 0; i < COLS; i++) claim(idx(i, cj), t, true);
      for (let j = 0; j < ROWS; j++) claim(idx(ci, j), t, true);
      break;
    }
    case "freeze": for (let o = 0; o < nTeams; o++) if (o !== t) frozen[o] = P.dur; break;
    case "shield": shield[t] = P.dur; break;
    case "quake": for (let k = 0; k < 2; k++) for (const c of borderOf(t, true)) claim(c, t, true); break;
    case "mirror": {
      const copy = lastPower && lastPower.team !== t ? lastPower.type : KEYS.filter(k => k !== "mirror")[Math.floor(rng() * (KEYS.length - 1))];
      announce(t, `Mirror → ${POWERS[copy].label}`);
      applyPower(b, copy, true); return;
    }
    case "steal": {
      let took = 0;
      for (const o of balls) {
        if (o.team === t) continue;
        for (const k of ["nitro", "wreck", "giant", "magnet"]) if (o[k] > 0) { b[k] = Math.max(b[k], o[k]) + 2; o[k] = 0; took++; }
        if (o.temp > 0) { o.team = t; took++; }
      }
      for (let o = 0; o < nTeams; o++) if (o !== t && shield[o] > 0) { shield[t] = shield[o]; shield[o] = 0; took++; }
      if (!took) { b.nitro = 5; b.giant = 5; }
      break;
    }
    default: b[type] = P.dur;
  }
  sfx(["bomb", "laser", "quake"].includes(type) ? "boom" : "power", t);
  if (P.dur === 0 && type !== "fort") recent[t].push({ k: type, left: 2 });
  if (!mirrored) { lastPower = { team: t, type }; announce(t, P.label); }
}

function stepBall(b, h) {
  if (frozen[b.team] > 0) return;
  const sp = BASE_SPEED * (b.nitro > 0 ? 2.2 : 1), r = b.r * (b.giant > 0 ? 2.5 : 1);
  b.x += b.dx * sp * h; b.y += b.dy * sp * h;
  if (b.x < r) { b.x = r; b.dx = Math.abs(b.dx); }
  if (b.x > COLS - r) { b.x = COLS - r; b.dx = -Math.abs(b.dx); }
  if (b.y < r) { b.y = r; b.dy = Math.abs(b.dy); }
  if (b.y > ROWS - r) { b.y = ROWS - r; b.dy = -Math.abs(b.dy); }
  const pts = b.giant > 0 ? 20 : 8;
  let fx = false, fy = false;
  for (let k = 0; k < pts; k++) {
    const a = k * Math.PI * 2 / pts, ca = Math.cos(a), sa = Math.sin(a);
    const i = Math.floor(b.x + ca * r), j = Math.floor(b.y + sa * r);
    if (!inB(i, j)) continue;
    const c = idx(i, j);
    if (owner[c] === b.team) continue;
    claim(c, b.team, false);
    sfx("hit", b.team);
    if (b.wreck > 0 && owner[c] === b.team) continue;
    if (Math.abs(ca) > Math.abs(sa)) { if (!fx) { b.dx = -Math.sign(ca) * Math.abs(b.dx); fx = true; } }
    else if (!fy) { b.dy = -Math.sign(sa) * Math.abs(b.dy); fy = true; }
  }
  if (fx || fy) fixAngle(b);
  for (let p = pickups.length - 1; p >= 0; p--) {
    const q = pickups[p];
    if (b.magnet > 0) {
      const dx = b.x - q.x, dy = b.y - q.y, d = Math.hypot(dx, dy);
      if (d < 12 && d > 0.01) { q.x += dx / d * 9 * h; q.y += dy / d * 9 * h; }
    }
    if (Math.hypot(q.x - b.x, q.y - b.y) < r + 0.45) { pickups.splice(p, 1); applyPower(b, q.type); }
  }
}

function tally() {
  counts = new Array(nTeams).fill(0);
  for (let c = 0; c < owner.length; c++) counts[owner[c]]++;
  alive = counts.filter(n => n > 0).length;
}

// power-ups come faster and stack higher the longer a round runs
const spawnGap = () => Math.max(0.3, 3 - time * 0.035);
const maxOnBoard = () => Math.min(16, 3 + Math.floor(time / 8));

function update(dt) {
  if (event && (event.left -= dt) <= 0) event = null;
  if (over) { winInfo.t += dt; return; }
  time += dt;
  for (let t = 0; t < nTeams; t++) {
    shield[t] = Math.max(0, shield[t] - dt); frozen[t] = Math.max(0, frozen[t] - dt);
    recent[t] = recent[t].filter(r => (r.left -= dt) > 0);
  }
  const sub = Math.ceil(dt * BASE_SPEED * 2.2 / 0.2), h = dt / sub;
  for (let s = 0; s < sub; s++) for (const b of balls.slice()) stepBall(b, h);
  for (const b of balls) {
    for (const k of ["nitro", "wreck", "giant", "magnet"]) if (b[k] > 0) b[k] -= dt;
    if (b.temp > 0 && (b.temp -= dt) <= 0) b.dead = true;
    b.trail.push([b.x, b.y]); if (b.trail.length > 8) b.trail.shift();
  }
  for (let c = 0; c < flash.length; c++) if (flash[c] > 0) flash[c] = Math.max(0, flash[c] - dt * 2.5);

  if (powersOn && (nextPickup -= dt) <= 0) {
    nextPickup = spawnGap();
    if (pickups.length < maxOnBoard()) {
      const i = Math.floor(rand(0, COLS)), j = Math.floor(rand(0, ROWS));
      pickups.push({ x: i + .5, y: j + .5, type: KEYS[Math.floor(rng() * KEYS.length)], born: time });
    }
  }

  tally();
  for (const b of balls) if (counts[b.team] === 0) b.dead = true;
  balls = balls.filter(b => !b.dead);
  for (let t = 0; t < nTeams; t++) if (counts[t] === 0 && !outs[t]) { outs[t] = true; announce(t, "is out"); }
  let lead = 0;
  for (let t = 1; t < nTeams; t++) if (counts[t] > counts[lead]) lead = t;
  if (counts[lead] / owner.length >= TARGET || alive === 1) {
    over = true;
    winInfo = { team: lead, t: 0, sub: fmt(time) };
    sfx("win", lead);
  }
}

function teamEffects(t) {
  const fx = [], mine = balls.filter(b => b.team === t);
  for (const k of ["nitro", "wreck", "giant", "magnet"]) {
    const m = Math.max(0, ...mine.map(b => b[k]));
    if (m > 0) fx.push({ k, p: m / POWERS[k].dur });
  }
  const extra = mine.filter(b => b.temp > 0);
  if (extra.length) fx.push({ k: "split", p: Math.max(...extra.map(b => b.temp)) / POWERS.split.dur });
  if (shield[t] > 0) fx.push({ k: "shield", p: shield[t] / POWERS.shield.dur });
  for (let c = 0; c < owner.length; c++) if (owner[c] === t && hp[c] > 0) { fx.push({ k: "fort", p: 1 }); break; }
  if (frozen[t] > 0) fx.push({ k: "freeze", p: frozen[t] / POWERS.freeze.dur, neg: true });
  for (const r of recent[t]) fx.push({ k: r.k, p: r.left / 2 });
  return fx;
}

// ---------- drawing (everything inside the 1080×1920 frame) ----------
function text(str, x, y, font, color, align = "left", spacing = 0) {
  ctx.font = font; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = "alphabetic";
  if ("letterSpacing" in ctx) ctx.letterSpacing = spacing + "px";
  ctx.fillText(str, x, y);
  if ("letterSpacing" in ctx) ctx.letterSpacing = "0px";
}
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }

// Power-up icons, drawn as shapes (no fonts or image files) so they look the same everywhere.
// Each fits a box s wide, centred on x,y.
function drawIcon(c, k, x, y, s, col) {
  const TAU = Math.PI * 2;
  const poly = (p, close) => { c.beginPath(); for (let i = 0; i < p.length; i += 2) c.lineTo(p[i], p[i + 1]); if (close) c.closePath(); };
  const dot = (px, py, r) => { c.beginPath(); c.arc(px, py, r, 0, TAU); c.fill(); };
  c.save(); c.translate(x, y); c.scale(s / 2, s / 2);
  c.fillStyle = c.strokeStyle = col; c.lineWidth = 0.26; c.lineCap = c.lineJoin = "round";
  switch (k) {
    case "nitro": poly([0.25, -1, -0.7, 0.15, -0.08, 0.15, -0.25, 1, 0.7, -0.15, 0.08, -0.15], true); c.fill(); break;
    case "wreck": c.rotate(Math.PI / 4); c.fillRect(-0.62, -0.9, 1.24, 0.6); c.fillRect(-0.14, -0.3, 0.28, 1.25); break;
    case "giant": poly([-0.65, -0.05, 0, -0.7, 0.65, -0.05]); c.stroke(); poly([-0.65, 0.7, 0, 0.05, 0.65, 0.7]); c.stroke(); break;
    case "split": dot(0, -0.52, 0.36); dot(-0.56, 0.42, 0.36); dot(0.56, 0.42, 0.36); break;
    case "fort":
      for (let r = 0; r < 3; r++) {
        const y0 = -0.9 + r * 0.63, h = 0.54;
        if (r % 2 === 0) { c.fillRect(-0.95, y0, 0.89, h); c.fillRect(0.06, y0, 0.89, h); }
        else { c.fillRect(-0.95, y0, 0.4, h); c.fillRect(-0.43, y0, 0.86, h); c.fillRect(0.55, y0, 0.4, h); }
      }
      break;
    case "bomb": dot(-0.12, 0.22, 0.68); poly([0.3, -0.28, 0.62, -0.62]); c.stroke(); dot(0.8, -0.8, 0.17); break;
    case "freeze":
      c.lineWidth = 0.19;
      for (let a = 0; a < 3; a++) {
        poly([0, -0.95, 0, 0.95]); c.stroke();
        poly([-0.25, -0.93, 0, -0.62, 0.25, -0.93]); c.stroke();
        poly([-0.25, 0.93, 0, 0.62, 0.25, 0.93]); c.stroke();
        c.rotate(Math.PI / 3);
      }
      break;
    case "laser":
      c.lineWidth = 0.22; c.beginPath(); c.arc(0, 0, 0.56, 0, TAU); c.stroke();
      for (let a = 0; a < 4; a++) { poly([0, -0.34, 0, -0.97]); c.stroke(); c.rotate(Math.PI / 2); }
      dot(0, 0, 0.13);
      break;
    case "shield":
      c.beginPath(); c.moveTo(0, -0.97); c.lineTo(0.8, -0.66); c.lineTo(0.8, 0);
      c.quadraticCurveTo(0.75, 0.7, 0, 1); c.quadraticCurveTo(-0.75, 0.7, -0.8, 0); c.lineTo(-0.8, -0.66);
      c.closePath(); c.fill();
      break;
    case "magnet":
      c.lineWidth = 0.44; c.lineCap = "butt";
      c.beginPath(); c.moveTo(-0.56, 0.4); c.lineTo(-0.56, -0.2); c.arc(0, -0.2, 0.56, Math.PI, 0); c.lineTo(0.56, 0.4); c.stroke();
      c.fillRect(-0.78, 0.54, 0.44, 0.4); c.fillRect(0.34, 0.54, 0.44, 0.4);
      break;
    case "quake": poly([-0.95, 0.15, -0.55, -0.6, -0.15, 0.55, 0.25, -0.6, 0.6, 0.4, 0.95, -0.15]); c.stroke(); break;
    case "mirror":
      poly([-0.17, -0.8, -0.17, 0.8, -0.98, 0.8], true); c.fill();
      c.lineWidth = 0.18; poly([0.27, -0.5, 0.27, 0.7, 0.85, 0.7], true); c.stroke();
      break;
    case "steal":
      // a thief's mask: a band with two eye holes
      c.beginPath(); c.moveTo(-0.98, -0.1); c.quadraticCurveTo(-0.98, -0.55, -0.5, -0.55); c.quadraticCurveTo(0, -0.4, 0.5, -0.55);
      c.quadraticCurveTo(0.98, -0.55, 0.98, -0.1); c.quadraticCurveTo(0.95, 0.55, 0.45, 0.55); c.quadraticCurveTo(0.15, 0.55, 0, 0.25);
      c.quadraticCurveTo(-0.15, 0.55, -0.45, 0.55); c.quadraticCurveTo(-0.95, 0.55, -0.98, -0.1); c.closePath();
      c.moveTo(-0.24, 0); c.ellipse(-0.48, 0, 0.24, 0.19, 0, 0, TAU); c.moveTo(0.72, 0); c.ellipse(0.48, 0, 0.24, 0.19, 0, 0, TAU);
      c.fill("evenodd");
      break;
  }
  c.restore();
}

function drawHeader() {
  text("Turf Pong", BX, 150, "700 44px Manrope, system-ui, sans-serif", CV.fg, "left", -1);
  text(fmt(time), BX + BW, 150, "400 30px 'DM Mono', ui-monospace, monospace", CV.dim, "right");
}

// slim strip: one segment per team — name, share, and tiny power-up rings
function drawStrip() {
  const y = 186, h = 86, gap = 12, n = nTeams, cw = (BW - gap * (n - 1)) / n;
  for (let t = 0; t < n; t++) {
    const T = TEAMS[t], x = BX + t * (cw + gap), pct = counts[t] / owner.length;
    ctx.globalAlpha = outs[t] ? 0.3 : 1;
    rrect(x, y, cw, h, 16); ctx.fillStyle = rgba(T.tile, 0.12); ctx.fill();
    // share fill along the bottom edge, with the 85% finish tick
    ctx.save(); rrect(x, y, cw, h, 16); ctx.clip();
    ctx.fillStyle = rgba(T.tile, 0.16); ctx.fillRect(x, y, cw * pct, h);
    ctx.fillStyle = T.ball; ctx.fillRect(x, y + h - 5, cw * pct, 5);
    ctx.fillStyle = rgba(CV.fg, 0.5); ctx.fillRect(x + cw * TARGET - 1, y + h - 14, 2, 14);
    ctx.restore();
    const label = T.name.toUpperCase(), room = cw - 40 - 96; // keep long names clear of the share number
    let nameSize = n === 4 ? 20 : 22;
    for (; nameSize > 12; nameSize--) { ctx.font = `700 ${nameSize}px Manrope, system-ui, sans-serif`; if (ctx.measureText(label).width + 2 * label.length <= room) break; }
    ctx.fillStyle = T.ball; ctx.beginPath(); ctx.arc(x + 24, y + 31, 7, 0, Math.PI * 2); ctx.fill();
    text(label, x + 40, y + 39, `700 ${nameSize}px Manrope, system-ui, sans-serif`, T.tile, "left", 2);
    text(Math.round(pct * 100) + "%", x + cw - 18, y + 40, "500 28px 'DM Mono', ui-monospace, monospace", CV.fg, "right");
    // power-up rings
    const fx = teamEffects(t), r = 14, step = 2 * r + 6, fit = Math.floor((cw - 36 + 6) / step);
    fx.slice(0, fit).forEach((f, k) => {
      const cx = x + 18 + r + k * step, cy = y + 63, col = f.neg ? CV.dim : T.ball;
      ctx.fillStyle = rgba(f.neg ? CV.dim : T.ball, 0.22); ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.lineCap = "round";
      ctx.beginPath(); ctx.arc(cx, cy, r - 1.5, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.max(0.02, Math.min(1, f.p))); ctx.stroke();
      ctx.fillStyle = f.neg ? CV.bg : T.tile; ctx.beginPath(); ctx.arc(cx, cy, r - 3, 0, Math.PI * 2); ctx.fill();
      drawIcon(ctx, f.k, cx, cy, 16, f.neg ? CV.fg : CV.ink);
    });
    ctx.globalAlpha = 1;
  }
}

function drawBoard() {
  const cs = CELL;
  ctx.save(); ctx.translate(BX, BY);
  rrect(0, 0, BW, BH, 18); ctx.clip();
  for (let j = 0; j < ROWS; j++) for (let i = 0; i < COLS; i++) {
    const c = idx(i, j), o = owner[c], T = TEAMS[o], f = flash[c];
    let col = T.tile;
    if (shield[o] > 0) col = mix(T.tile, 255, 0.25 + 0.1 * Math.sin(time * 10));
    else if (f > 0) col = mix(T.tile, 255, f * 0.6);
    ctx.fillStyle = col; ctx.fillRect(i * cs, j * cs, cs + 0.5, cs + 0.5);
    if (hp[c] > 0) {
      ctx.fillStyle = mix(T.ball, 255, 0.35);
      ctx.beginPath(); ctx.arc(i * cs + cs / 2, j * cs + cs / 2, cs * 0.07 * (1 + hp[c] * 0.4), 0, Math.PI * 2); ctx.fill();
    }
  }
  for (const p of pickups) {
    const x = p.x * cs, y = p.y * cs, pulse = 1 + 0.08 * Math.sin((time - p.born) * 5);
    ctx.fillStyle = "#ffffff"; ctx.beginPath(); ctx.arc(x, y, cs * 0.44 * pulse, 0, Math.PI * 2); ctx.fill();
    drawIcon(ctx, p.type, x, y, cs * 0.58 * pulse, CV.ink);
  }
  for (const b of balls) {
    const T = TEAMS[b.team], r = b.r * (b.giant > 0 ? 2.5 : 1) * cs, ice = frozen[b.team] > 0;
    if (b.nitro > 0) b.trail.forEach(([x, y], k) => {
      ctx.globalAlpha = (k / b.trail.length) * 0.35; ctx.fillStyle = T.ball;
      ctx.beginPath(); ctx.arc(x * cs, y * cs, r * (k / b.trail.length), 0, Math.PI * 2); ctx.fill();
    });
    ctx.globalAlpha = 1;
    ctx.fillStyle = ice ? "#ffffff" : T.ball;
    ctx.beginPath(); ctx.arc(b.x * cs, b.y * cs, r, 0, Math.PI * 2); ctx.fill();
    if (ice) { ctx.strokeStyle = T.ball; ctx.lineWidth = 4; ctx.stroke(); }
    if (b.wreck > 0) { ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(b.x * cs, b.y * cs, r * 0.55, 0, Math.PI * 2); ctx.stroke(); }
    if (b.magnet > 0) { ctx.strokeStyle = T.ball; ctx.globalAlpha = 0.35; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(b.x * cs, b.y * cs, r + cs * (0.4 + 0.2 * Math.sin(time * 8)), 0, Math.PI * 2); ctx.stroke(); ctx.globalAlpha = 1; }
  }
  if (over) {
    const T = TEAMS[winInfo.team], a = Math.min(1, winInfo.t / 0.5);
    ctx.fillStyle = rgba(CV.bg, 0.72 * a); ctx.fillRect(0, 0, BW, BH);
    ctx.globalAlpha = a;
    const s = 0.9 + 0.1 * Math.min(1, winInfo.t / 0.35);
    ctx.save(); ctx.translate(BW / 2, BH / 2 - 10); ctx.scale(s, s);
    text(`${T.name} wins`, 0, 0, "700 112px Manrope, system-ui, sans-serif", T.tile, "center", -3);
    ctx.restore();
    text(winInfo.sub, BW / 2, BH / 2 + 60, "400 32px 'DM Mono', ui-monospace, monospace", CV.fg, "center");
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

function drawFooter() {
  if (event) {
    const T = TEAMS[event.team], a = Math.min(1, event.left / 0.4);
    ctx.globalAlpha = a;
    ctx.font = "600 40px Manrope, system-ui, sans-serif";
    const name = T.name, rest = `  ${event.text}`;
    const wn = ctx.measureText(name).width, wr = ctx.measureText(rest).width, x0 = W / 2 - (wn + wr) / 2;
    text(name, x0, BY + BH + 84, "600 40px Manrope, system-ui, sans-serif", T.tile);
    text(rest, x0 + wn, BY + BH + 84, "500 40px Manrope, system-ui, sans-serif", CV.fg);
    ctx.globalAlpha = 1;
  }
}

function draw() {
  ctx.fillStyle = CV.bg; ctx.fillRect(0, 0, W, H);
  drawHeader(); drawStrip(); drawBoard(); drawFooter();
}

// ---------- sound ----------
// Small synthesized sounds: a note per block hit (each team has its own key), a chime per power-up,
// a thump for Bomb / Laser / Quake, and a short tune for the win. The same sounds go into recorded videos.
const SCALE = [0, 2, 4, 7, 9, 12, 14];
const ROOTS = [523.25, 392.0, 659.25, 440.0];
let actx = null, liveOut = null, soundOn = true, noteStep = 0, recEvents = null, recClock = 0;
const lastHit = [0, 0, 0, 0].map(() => -1);
const clockNow = () => recEvents ? recClock : performance.now() / 1000;

function sfx(type, team) {
  const t = clockNow();
  if (type === "hit") { if (t - lastHit[team] < 0.06) return; lastHit[team] = t; }
  const ev = { type, team, t, note: SCALE[(noteStep++ * 3) % SCALE.length] };
  if (recEvents) { recEvents.push(ev); return; }
  if (soundOn && actx && actx.state === "running") play(actx, liveOut, ev, actx.currentTime + 0.01);
}
function makeOut(ctx) {
  const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 4;
  const g = ctx.createGain(); g.gain.value = 0.85; comp.connect(g); g.connect(ctx.destination); return comp;
}
function tone(ctx, out, when, freq, type, peak, decay, toFreq) {
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, when);
  if (toFreq) o.frequency.exponentialRampToValueAtTime(toFreq, when + decay);
  g.gain.setValueAtTime(0.0001, when);
  g.gain.exponentialRampToValueAtTime(peak, when + 0.005);
  g.gain.exponentialRampToValueAtTime(0.0001, when + decay);
  o.connect(g); g.connect(out); o.start(when); o.stop(when + decay + 0.03);
}
function play(ctx, out, ev, when) {
  const root = ROOTS[ev.team % 4], f = st => root * Math.pow(2, st / 12);
  switch (ev.type) {
    case "hit": tone(ctx, out, when, f(ev.note), "triangle", 0.08, 0.12); break;
    case "power":
      tone(ctx, out, when, f(12), "sine", 0.16, 0.22);
      tone(ctx, out, when + 0.07, f(19), "sine", 0.14, 0.32);
      tone(ctx, out, when + 0.07, f(24), "triangle", 0.04, 0.28);
      break;
    case "boom":
      tone(ctx, out, when, 180, "sine", 0.5, 0.5, 42);
      tone(ctx, out, when + 0.02, f(12), "sine", 0.1, 0.3);
      break;
    case "win": [0, 4, 7, 12, 16].forEach((st, i) => tone(ctx, out, when + i * 0.12, f(st), "triangle", 0.16, 0.7)); break;
  }
}
function wakeAudio() { // browsers only allow sound after a click or key press
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  if (!actx) { actx = new AC(); liveOut = makeOut(actx); }
  if (actx.state === "suspended") actx.resume();
}
document.addEventListener("pointerdown", wakeAudio);
document.addEventListener("keydown", wakeAudio);

let rendering = false;

// ---------- controls ----------
function resize() {
  const st = $("stage").getBoundingClientRect();
  const s = Math.min(st.width / W, st.height / H);
  cv.style.width = Math.floor(W * s) + "px"; cv.style.height = Math.floor(H * s) + "px";
}
const press = (grp, btn) => document.querySelectorAll(`#${grp} button`).forEach(b => b.setAttribute("aria-pressed", b === btn));
[2, 3, 4].forEach(n => $("t" + n).onclick = e => { nTeams = n; press("gTeams", e.currentTarget); reset(); });
[1, 2, 4].forEach(n => $("s" + n).onclick = e => { speedMult = n; press("gSpeed", e.currentTarget); });
$("pw").onclick = e => { powersOn = !powersOn; e.currentTarget.setAttribute("aria-pressed", powersOn); if (!powersOn) pickups = []; };
$("restart").onclick = reset;
$("snd").onclick = e => { soundOn = !soundOn; e.currentTarget.setAttribute("aria-pressed", soundOn); if (soundOn) wakeAudio(); };
cv.onclick = () => { if (over && !rendering) reset(); };
[..."t2 t3 t4 restart".split(" ")].forEach(id => $(id).addEventListener("click", e => { if (rendering) e.stopImmediatePropagation(); }, true));
press("gTeams", $("t2")); press("gSpeed", $("s1"));
// Colours row: one picker per team. "Random" (the default) draws a new colour every game.
for (let t = 0; t < 4; t++) {
  const lab = document.createElement("label"), sw = document.createElement("i"), sel = document.createElement("select");
  sel.id = "c" + (t + 1); sel.setAttribute("aria-label", `Team ${t + 1} colour`);
  sel.innerHTML = `<option value="-1">Random</option>` + PALETTE.map((p, i) => `<option value="${i}">${p.name}</option>`).join("");
  sel.onchange = () => {
    if (rendering) { sel.value = choice[t]; return; }
    choice[t] = +sel.value;
    if (choice[t] >= 0) for (let o = 0; o < 4; o++) if (o !== t && choice[o] === choice[t]) { choice[o] = -1; $("c" + (o + 1)).value = -1; }
    reset();
  };
  lab.append(sw, sel); $("gCols").append(lab);
}
$("pwList").innerHTML = KEYS.map(k => `<div><canvas width="48" height="48" data-k="${k}"></canvas><span><b>${POWERS[k].label}</b> ${POWERS[k].desc}</span></div>`).join("");
function drawLegend() {
  const col = getComputedStyle(document.body).color;
  document.querySelectorAll("#pwList canvas").forEach(c => { const g = c.getContext("2d"); g.clearRect(0, 0, 48, 48); drawIcon(g, c.dataset.k, 24, 24, 42, col); });
}
drawLegend();
if (window.matchMedia) matchMedia("(prefers-color-scheme: dark)").addEventListener("change", drawLegend);

window.addEventListener("resize", resize);
if (window.ResizeObserver) new ResizeObserver(resize).observe($("stage"));

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!rendering) {
    for (let k = 0; k < speedMult; k++) update(dt);
    draw();
  }
  requestAnimationFrame(loop);
}
reset(); resize();
requestAnimationFrame(loop);
})();
</script>

</body></html>
